# Koyeb Service Deployment Configuration
# Free Eco/Nano Tier deployment blueprint
name: incubrix-video-engine
type: web
docker:
  dockerfile: Dockerfile
ports:
  - port: 8000
    path: /
routes:
  - path: /
    port: 8000
regions:
  - fra
instance_type: nano
scalings:
  min: 1
  max: 1
health_checks:
  - http:
      path: /health
      port: 8000
env:
  - key: FFMPEG_THREADS
    value: "2"
  - key: MAX_CONCURRENT_JOBS
    value: "1"
  - key: TTS_PROVIDER
    value: "gtts"
