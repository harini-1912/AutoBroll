<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncuBrix | Script & Voiceover to B-Roll Video Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- React 18 and Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 28, 45, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 1080px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-logo {
      width: 42px; height: 42px; border-radius: 10px;
      background: var(--accent-gradient);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.25rem; color: #fff;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
    }
    .brand h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    .badge {
      display: inline-block; padding: 0.25rem 0.6rem; border-radius: 9999px;
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .badge-queued { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
    .badge-processing { background: rgba(99, 102, 241, 0.2); color: #818cf8; animation: pulse 1.5s infinite; }
    .badge-completed { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-failed { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .card h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.25rem; }

    .tab-group { display: flex; gap: 0.5rem; background: rgba(0,0,0,0.25); padding: 0.25rem; border-radius: 8px; margin-bottom: 1.25rem; }
    .tab-btn {
      flex: 1; padding: 0.5rem 0.75rem; border: none; background: transparent;
      color: var(--text-muted); font-size: 0.85rem; font-weight: 500; border-radius: 6px; cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }

    .form-group { margin-bottom: 1.15rem; }
    label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.4rem; }
    input[type="text"], textarea, select {
      width: 100%; padding: 0.75rem; border-radius: 8px;
      background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text); font-family: inherit; font-size: 0.9rem;
      transition: border 0.2s;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }
    textarea { resize: vertical; min-height: 100px; }

    .checkbox-group { display: flex; gap: 1rem; margin-top: 0.4rem; }
    .checkbox-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; cursor: pointer; color: var(--text); }

    .btn-submit {
      width: 100%; padding: 0.85rem; border-radius: 8px; border: none;
      background: var(--accent-gradient); color: #fff; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }
    .btn-submit:hover:not(:disabled) { opacity: 0.95; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Progress & Tracker */
    .progress-track {
      width: 100%; height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 9999px;
      overflow: hidden; margin: 1rem 0 0.5rem;
    }
    .progress-bar {
      height: 100%; background: var(--accent-gradient); border-radius: 9999px;
      transition: width 0.4s ease;
    }
    .stage-pill {
      display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.75rem;
      border-radius: 6px; background: rgba(99, 102, 241, 0.15); color: #a5b4fc;
      font-size: 0.8rem; font-family: 'JetBrains Mono', monospace;
    }

    .output-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 8px; margin-bottom: 0.6rem;
    }
    .output-link {
      color: #818cf8; text-decoration: none; font-weight: 500; font-size: 0.85rem;
      display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .output-link:hover { text-decoration: underline; }
    .btn-download {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      border: none;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s;
    }
    .btn-download:hover:not(:disabled) {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-1px);
    }
    .btn-download:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5; padding: 1rem; border-radius: 8px; margin-top: 1rem; font-size: 0.85rem;
    }
    .warning-box {
      background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fde68a; padding: 0.75rem 1rem; border-radius: 8px; margin-top: 0.75rem; font-size: 0.85rem;
    }
    pre.code-viewer {
      background: #050811; border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 1rem; border-radius: 8px; font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; max-height: 250px; overflow-y: auto; color: #cbd5e1;
    }

    /* Scene Swap Panel */
    .swap-panel {
      margin-top: 2rem;
      background: var(--card-bg);
      border: 1px solid rgba(99, 102, 241, 0.25);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .swap-panel h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.25rem; color: #a5b4fc; }
    .scene-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
    .scene-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem 0.9rem;
      border-radius: 8px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.02);
      transition: all 0.15s;
      font-size: 0.82rem;
    }
    .scene-item:hover { background: rgba(99,102,241,0.1); border-color: rgba(99,102,241,0.35); }
    .scene-item.selected { background: rgba(99,102,241,0.18); border-color: rgba(99,102,241,0.55); }
    .scene-num {
      min-width: 26px; min-height: 26px; border-radius: 6px;
      background: rgba(99,102,241,0.2); color: #818cf8;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700;
    }
    .scene-text { flex: 1; color: #cbd5e1; line-height: 1.4; }
    .scene-provider { font-size: 0.72rem; color: #64748b; white-space: nowrap; }
    .swap-form { border-top: 1px solid rgba(255,255,255,0.07); padding-top: 1.25rem; margin-top: 0.25rem; }
    .swap-selected-label {
      font-size: 0.8rem; color: #818cf8; margin-bottom: 1rem;
      background: rgba(99,102,241,0.12); padding: 0.4rem 0.75rem;
      border-radius: 6px; display: inline-block;
    }
    .btn-swap {
      width: 100%; padding: 0.8rem; border-radius: 8px; border: none;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #fff; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 15px rgba(99,102,241,0.35);
    }
    .btn-swap:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn-swap:disabled { opacity: 0.45; cursor: not-allowed; }
    .swap-success-box {
      background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7; padding: 0.85rem 1rem; border-radius: 8px;
      font-size: 0.85rem; margin-top: 1rem;
    }
    .advanced-toggle {
      background: transparent; border: none; color: #64748b;
      font-size: 0.8rem; cursor: pointer; padding: 0;
      display: flex; align-items: center; gap: 0.3rem;
      margin-bottom: 0.75rem;
    }
    .advanced-toggle:hover { color: #94a3b8; }

    /* Idea to Storyboard Companion */
    .storyboard-workbench {
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .storyboard-workbench::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: var(--accent-gradient);
    }
    .storyboard-card {
      background: rgba(10, 15, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 1.1rem;
      margin-top: 1rem;
    }
    .storyboard-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .storyboard-card-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-copy {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-copy:hover {
      background: rgba(99, 102, 241, 0.3);
      color: #fff;
    }
    .narration-display {
      font-size: 0.88rem;
      line-height: 1.6;
      color: #e2e8f0;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      padding: 0.85rem;
      border-left: 3px solid #6366f1;
    }
    .storyboard-scene-row {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition: border-color 0.15s;
    }
    .storyboard-scene-row:hover {
      border-color: rgba(99, 102, 241, 0.3);
    }
    .scene-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .scene-badge-pill {
      font-size: 0.7rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.18);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }
    .visual-query-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .btn-apply-generator {
      width: 100%;
      padding: 0.9rem;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
      transition: all 0.2s;
      margin-top: 1.25rem;
    }
    .btn-apply-generator:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
    }
    .quick-helper-link {
      background: transparent;
      border: 1px dashed rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      font-size: 0.78rem;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s;
    }
    .quick-helper-link:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.8);
      color: #fff;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [inputMode, setInputMode] = useState('script'); // 'script', 'scenes', 'audio'
      const [script, setScript] = useState('A creator records a sixty-second voiceover about saving money and investing with patience. Financial freedom requires discipline and smart planning.');
      const [scenesText, setScenesText] = useState(JSON.stringify([
        {"text": "A creator records a voiceover about saving money.", "visual_hint": "piggy bank or digital finance dashboard"},
        {"text": "Financial freedom requires discipline and smart planning.", "visual_hint": "stock chart growth and team meeting"}
      ], null, 2));
      const [audioUrl, setAudioUrl] = useState('');
      const [audioTranscript, setAudioTranscript] = useState('');
      const [audioInputType, setAudioInputType] = useState('file'); // 'file' or 'url'
      const [audioFile, setAudioFile] = useState(null);
      const [voice, setVoice] = useState('en-IN-female');
      const [aspectRatios, setAspectRatios] = useState(['16:9']);
      const [style, setStyle] = useState('bright, modern, real-world footage');
      const [avoid, setAvoid] = useState("people's faces, alcohol");

      const [loading, setLoading] = useState(false);
      const [activeJobId, setActiveJobId] = useState(null);
      const [jobStatus, setJobStatus] = useState(null);
      const [activeModal, setActiveModal] = useState(null);
      const [modalData, setModalData] = useState(null);
      const [selectedSceneForSwap, setSelectedSceneForSwap] = useState(null);
      const [swapQuery, setSwapQuery] = useState('');
      const [swapLoading, setSwapLoading] = useState(false);
      const [swapMsg, setSwapMsg] = useState(null);  // {type: 'success'|'error', text: string}
      const [swapAdvanced, setSwapAdvanced] = useState(false);
      const [swapClipId, setSwapClipId] = useState('');
      const [swapProvider, setSwapProvider] = useState('');
      const [swapVideoUrl, setSwapVideoUrl] = useState('');
      const [timelineData, setTimelineData] = useState(null);

      // Video Preview & Download Feedback State
      const [selectedRatioPreview, setSelectedRatioPreview] = useState('16:9');
      const [downloadingKey, setDownloadingKey] = useState(null);
      const [downloadError, setDownloadError] = useState(null);

      // Audio Transcription & Verification Workflow State
      const [audioAnalyzing, setAudioAnalyzing] = useState(false);
      const [audioAnalyzeError, setAudioAnalyzeError] = useState(null);
      const [audioReviewData, setAudioReviewData] = useState(null); // { raw_transcript: string, scenes_json: string }

      // Idea to Storyboard Companion State
      const [brainDumpText, setBrainDumpText] = useState('');
      const [targetSceneCount, setTargetSceneCount] = useState(4);
      const [storyboardLoading, setStoryboardLoading] = useState(false);
      const [storyboardError, setStoryboardError] = useState(null);
      const [storyboardResult, setStoryboardResult] = useState(null);
      const [copiedNarration, setCopiedNarration] = useState(false);
      const [copiedJson, setCopiedJson] = useState(false);
      const [appliedNotice, setAppliedNotice] = useState(null);

      const pollingTimerRef = useRef(null);

      // Handle Aspect Ratio Toggle
      const toggleRatio = (ratio) => {
        if (aspectRatios.includes(ratio)) {
          if (aspectRatios.length > 1) {
            setAspectRatios(aspectRatios.filter(r => r !== ratio));
          }
        } else {
          setAspectRatios([...aspectRatios, ratio]);
        }
      };

      // Submit Job
      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setJobStatus(null);
        setActiveModal(null);

        try {
          const idempKey = 'ui-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8);
          let res;

          if (inputMode === 'audio' && audioInputType === 'file') {
            if (!audioFile) {
              throw new Error('Please select an audio file (.mp3, .wav, or .m4a).');
            }
            const formData = new FormData();
            formData.append('audio_file', audioFile);
            formData.append('voice', voice);
            formData.append('aspect_ratios', aspectRatios.join(','));
            formData.append('style', style);
            if (avoid) formData.append('avoid', avoid);
            if (audioTranscript && audioTranscript.trim()) formData.append('script', audioTranscript.trim());
            formData.append('burn_in_captions', 'true');

            res = await fetch('/api/v1/broll/jobs/upload', {
              method: 'POST',
              headers: {
                'Idempotency-Key': idempKey
              },
              body: formData
            });
          } else {
            const payload = {
              voice,
              aspect_ratios: aspectRatios,
              style,
              avoid: avoid.split(',').map(s => s.trim()).filter(Boolean),
              captions: { burn_in: true, srt: true }
            };

            if (inputMode === 'script') {
              payload.script = script;
            } else if (inputMode === 'scenes') {
              payload.scenes = JSON.parse(scenesText);
            } else {
              if (!audioUrl || !audioUrl.trim()) {
                throw new Error('Please enter a valid public audio URL (.mp3 or .wav).');
              }
              payload.audio_url = audioUrl.trim();
              if (audioTranscript && audioTranscript.trim()) {
                payload.script = audioTranscript.trim();
              }
            }

            res = await fetch('/api/v1/broll/jobs', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Idempotency-Key': idempKey
              },
              body: JSON.stringify(payload)
            });
          }

          if (!res.ok) {
            alert(`Server error (${res.status}): ${await res.text() || res.statusText}`);
            return;
          }

          const data = await res.json();
          if (data && data.job_id) {
            setActiveJobId(data.job_id);
            setJobStatus(data);
          }
        } catch (err) {
          alert('Submission error: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      // Polling Effect
      useEffect(() => {
        if (!activeJobId) return;

        const checkStatus = async () => {
          try {
            const res = await fetch(`/api/v1/broll/jobs/${activeJobId}`);
            if (res.ok) {
              const data = await res.json();
              setJobStatus(data);
              // Stop polling if completed or failed
              if (['completed', 'succeeded', 'failed'].includes(data.status)) {
                if (pollingTimerRef.current) {
                  clearInterval(pollingTimerRef.current);
                  pollingTimerRef.current = null;
                }
              }
            }
          } catch (err) {
            console.error('Polling error:', err);
          }
        };

        // Poll immediately and setup interval
        checkStatus();
        pollingTimerRef.current = setInterval(checkStatus, 1500);

        return () => {
          if (pollingTimerRef.current) {
            clearInterval(pollingTimerRef.current);
            pollingTimerRef.current = null;
          }
        };
      }, [activeJobId]);

      // View Metadata Modal
      const viewMetadata = async (type) => {
        if (!activeJobId) return;
        try {
          const res = await fetch(`/api/v1/broll/jobs/${activeJobId}/${type}`);
          const json = await res.json();
          setModalData(json);
          setActiveModal(type);
          if (type === 'timeline') setTimelineData(json);
        } catch (err) {
          alert(`Failed to load ${type}: ` + err.message);
        }
      };

      // Fetch timeline for the scene-swap panel
      const fetchTimeline = async (jid) => {
        try {
          const res = await fetch(`/api/v1/broll/jobs/${jid}/timeline`);
          if (res.ok) {
            const json = await res.json();
            setTimelineData(json);
          }
        } catch (_) {}
      };

      // Handle reliable file download with blob creation and direct fallback
      const handleDownload = async (url, filename, key) => {
        setDownloadingKey(key);
        setDownloadError(null);
        try {
          const res = await fetch(url);
          if (!res.ok) {
            let msg = `Server returned HTTP ${res.status}`;
            try {
              const errJson = await res.json();
              if (errJson?.error?.message) msg = errJson.error.message;
            } catch (_) {}
            throw new Error(msg);
          }
          const blob = await res.blob();
          const blobUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => window.URL.revokeObjectURL(blobUrl), 3000);
        } catch (err) {
          console.error('Download error:', err);
          setDownloadError(`Could not download ${filename}: ${err.message}. If the host restarted, please generate a new video.`);
          window.open(url, '_blank');
        } finally {
          setDownloadingKey(null);
        }
      };

      // Submit a scene clip swap request
      const handleSwapSubmit = async (e) => {
        e.preventDefault();
        if (!activeJobId || !selectedSceneForSwap || swapLoading) return;

        setSwapLoading(true);
        setSwapMsg(null);

        const body = {};
        if (swapQuery.trim())          body.query_override       = swapQuery.trim();
        if (swapClipId.trim())         body.clip_id              = swapClipId.trim();
        if (swapProvider.trim())       body.provider_override    = swapProvider.trim();
        if (swapVideoUrl.trim())       body.video_url            = swapVideoUrl.trim();

        try {
          const res = await fetch(
            `/api/v1/broll/jobs/${activeJobId}/scenes/${selectedSceneForSwap.scene_id}/clip`,
            {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            }
          );
          const data = await res.json();
          if (!res.ok) {
            const errMsg = data?.error?.message || `HTTP ${res.status}`;
            setSwapMsg({ type: 'error', text: errMsg });
          } else {
            setSwapMsg({
              type: 'success',
              text: `Scene replaced successfully (${data.affected_aspect_ratios?.join(', ')}) via ${data.swapped_clip?.provider || 'provider'}.`,
            });
            // Refresh job status and timeline
            const statusRes = await fetch(`/api/v1/broll/jobs/${activeJobId}`);
            if (statusRes.ok) setJobStatus(await statusRes.json());
            await fetchTimeline(activeJobId);
            setSelectedSceneForSwap(null);
            setSwapQuery('');
            setSwapClipId('');
            setSwapProvider('');
            setSwapVideoUrl('');
          }
        } catch (err) {
          setSwapMsg({ type: 'error', text: 'Network error: ' + err.message });
        } finally {
          setSwapLoading(false);
        }
      };

      // Storyboard Generation Handler
      const handleGenerateStoryboard = async () => {
        if (!brainDumpText.trim()) return;
        setStoryboardLoading(true);
        setStoryboardError(null);
        setAppliedNotice(null);

        try {
          const res = await fetch('/api/storyboard/from-brain-dump', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              raw_text: brainDumpText.trim(),
              target_scene_count: parseInt(targetSceneCount, 10) || 4,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            const errMsg = data?.error?.message || data?.detail || `HTTP ${res.status}`;
            setStoryboardError(errMsg);
          } else {
            setStoryboardResult(data);
          }
        } catch (err) {
          setStoryboardError('Network error: ' + err.message);
        } finally {
          setStoryboardLoading(false);
        }
      };

      // Copy Narration
      const handleCopyNarration = () => {
        if (!storyboardResult?.polished_narration) return;
        navigator.clipboard.writeText(storyboardResult.polished_narration);
        setCopiedNarration(true);
        setTimeout(() => setCopiedNarration(false), 2000);
      };

      // Copy JSON
      const handleCopyJson = () => {
        if (!storyboardResult?.scenes) return;
        navigator.clipboard.writeText(JSON.stringify(storyboardResult.scenes, null, 2));
        setCopiedJson(true);
        setTimeout(() => setCopiedJson(false), 2000);
      };

      // Apply Directly to Video Generator
      const handleApplyToGenerator = () => {
        if (!storyboardResult) return;
        setScript(storyboardResult.polished_narration);
        setScenesText(JSON.stringify(storyboardResult.scenes, null, 2));
        setInputMode('scenes');
        setAppliedNotice(`Loaded ${storyboardResult.scenes.length} scenes into Video Generator! You can now click Generate B-Roll Video.`);
      };

      // Analyze & Transcribe Audio Workflow Handler
      const handleAnalyzeAudio = async () => {
        if (audioInputType === 'file' && !audioFile) {
          alert('Please select an audio file first.');
          return;
        }
        if (audioInputType === 'url' && (!audioUrl || !audioUrl.trim())) {
          alert('Please enter a public audio URL first.');
          return;
        }

        setAudioAnalyzing(true);
        setAudioAnalyzeError(null);

        try {
          let res;
          if (audioInputType === 'file') {
            const formData = new FormData();
            formData.append('file', audioFile);
            res = await fetch('/api/v1/audio/transcribe-to-scenes', {
              method: 'POST',
              body: formData,
            });
          } else {
            const formData = new FormData();
            formData.append('audio_url', audioUrl.trim());
            res = await fetch('/api/v1/audio/transcribe-to-scenes', {
              method: 'POST',
              body: formData,
            });
          }

          const data = await res.json();
          if (!res.ok) {
            const errMsg = data?.error?.message || data?.detail || `HTTP ${res.status}`;
            throw new Error(errMsg);
          }

          setAudioReviewData({
            raw_transcript: data.raw_transcript || '',
            scenes_json: JSON.stringify(data.scenes || [], null, 2),
          });
        } catch (err) {
          console.error('Audio analysis failed:', err);
          setAudioAnalyzeError(err.message);
        } finally {
          setAudioAnalyzing(false);
        }
      };

      // Confirm and Load Verified Scenes into IncuBrix Scene Editor
      const handleConfirmAudioScenes = () => {
        if (!audioReviewData) return;
        try {
          const parsed = JSON.parse(audioReviewData.scenes_json);
          if (!Array.isArray(parsed)) {
            throw new Error('Scenes must be a JSON array of scene objects.');
          }
          setScenesText(JSON.stringify(parsed, null, 2));
          setScript(audioReviewData.raw_transcript);
          setAudioTranscript(audioReviewData.raw_transcript);
          setInputMode('scenes');
          setAppliedNotice(`Loaded ${parsed.length} verified scenes from audio! Review your scene visual prompts below, then click Generate B-Roll Video.`);
          setAudioReviewData(null);
        } catch (err) {
          alert('Invalid JSON in Scenes area: ' + err.message);
        }
      };

      return (
        <div className="container">
          <header>
            <div className="brand">
              <div className="brand-logo">IB</div>
              <div>
                <h1>IncuBrix Video Engine</h1>
                <p style={{fontSize: '0.8rem', color: '#94a3b8'}}>Script & Voiceover to B-Roll Video Pipeline</p>
              </div>
            </div>
            <div style={{display: 'flex', gap: '0.75rem'}}>
              <a href="/docs" target="_blank" className="badge" style={{background: 'rgba(255,255,255,0.08)', color: '#fff', textDecoration: 'none'}}>API Docs</a>
              <a href="/openapi.yaml" target="_blank" className="badge" style={{background: 'rgba(255,255,255,0.08)', color: '#fff', textDecoration: 'none'}}>OpenAPI 3.1</a>
            </div>
          </header>

          <div className="grid">
            {/* Input Card */}
            <div className="card">
              <h2>1. Configure Video Job</h2>
              <div className="tab-group">
                <button type="button" className={`tab-btn ${inputMode === 'script' ? 'active' : ''}`} onClick={() => setInputMode('script')}>Plain Script</button>
                <button type="button" className={`tab-btn ${inputMode === 'scenes' ? 'active' : ''}`} onClick={() => setInputMode('scenes')}>IncuBrix Scenes</button>
                <button type="button" className={`tab-btn ${inputMode === 'audio' ? 'active' : ''}`} onClick={() => setInputMode('audio')}>Audio File / URL</button>
                <button type="button" className={`tab-btn ${inputMode === 'storyboard' ? 'active' : ''}`} onClick={() => setInputMode('storyboard')}>✨ Idea to Script & Visuals</button>
              </div>

              {appliedNotice && (
                <div className="swap-success-box" style={{marginBottom: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                  <span>{appliedNotice}</span>
                  <button type="button" onClick={() => setAppliedNotice(null)} style={{background: 'none', border: 'none', color: '#6ee7b7', cursor: 'pointer'}}>✕</button>
                </div>
              )}

              {inputMode !== 'storyboard' && (
                <div style={{display: 'flex', justifyContent: 'flex-end', marginBottom: '0.85rem'}}>
                  <button type="button" className="quick-helper-link" onClick={() => setInputMode('storyboard')}>
                    ✨ Have raw ideas? Use Idea to Storyboard Companion →
                  </button>
                </div>
              )}

              {inputMode === 'storyboard' ? (
                <div className="storyboard-workbench">
                  <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.5rem'}}>
                    <span style={{fontSize: '0.75rem', fontWeight: 700, letterSpacing: '0.05em', color: '#a5b4fc', textTransform: 'uppercase'}}>
                      AI Storyboard Assistant
                    </span>
                    <span style={{fontSize: '0.72rem', color: '#64748b'}}>Non-destructive Companion Layer</span>
                  </div>
                  <p style={{fontSize: '0.82rem', color: '#94a3b8', marginBottom: '1rem', lineHeight: 1.4}}>
                    Drop your raw, unedited thoughts or video idea here to craft a hook-driven narration script and structured IncuBrix B-Roll scenes with concrete physical search tags.
                  </p>

                  <div className="form-group">
                    <label>Drop your raw, unedited thoughts or video idea here...</label>
                    <textarea
                      rows="5"
                      value={brainDumpText}
                      onChange={e => setBrainDumpText(e.target.value)}
                      placeholder="e.g. Founders blow their seed round on expensive downtown offices and vanity marketing instead of talking to real users. If you spend 8 hours a day building without user feedback, you are flying blind. Get out of the building and watch customers use your product."
                    />
                  </div>

                  <div className="form-group" style={{display: 'flex', alignItems: 'center', gap: '0.75rem'}}>
                    <label style={{marginBottom: 0, whiteSpace: 'nowrap'}}>Target Scenes:</label>
                    <select
                      style={{width: 'auto', minWidth: '130px'}}
                      value={targetSceneCount}
                      onChange={e => setTargetSceneCount(Number(e.target.value))}
                    >
                      <option value="2">2 Scenes</option>
                      <option value="3">3 Scenes</option>
                      <option value="4">4 Scenes (Default)</option>
                      <option value="5">5 Scenes</option>
                      <option value="6">6 Scenes</option>
                      <option value="8">8 Scenes</option>
                    </select>
                  </div>

                  <button
                    type="button"
                    className="btn-submit"
                    disabled={storyboardLoading || !brainDumpText.trim()}
                    onClick={handleGenerateStoryboard}
                  >
                    {storyboardLoading ? 'Crafting Narration & Visuals...' : 'Generate Storyboard'}
                  </button>

                  {storyboardError && (
                    <div className="error-box" style={{marginTop: '1rem'}}>
                      <strong>Error:</strong> {storyboardError}
                    </div>
                  )}

                  {storyboardResult && (
                    <div style={{marginTop: '1.25rem'}}>
                      {/* Polished Narration Card */}
                      <div className="storyboard-card">
                        <div className="storyboard-card-header">
                          <div className="storyboard-card-title">
                            <span>🎙️ Polished Narration</span>
                          </div>
                          <button type="button" className="btn-copy" onClick={handleCopyNarration}>
                            {copiedNarration ? '✓ Copied!' : 'Copy Narration'}
                          </button>
                        </div>
                        <div className="narration-display">
                          "{storyboardResult.polished_narration}"
                        </div>
                      </div>

                      {/* Scene Breakdown Card */}
                      <div className="storyboard-card">
                        <div className="storyboard-card-header">
                          <div className="storyboard-card-title">
                            <span>🎬 Scene Breakdown ({storyboardResult.scenes?.length || 0} Scenes)</span>
                          </div>
                          <button type="button" className="btn-copy" onClick={handleCopyJson}>
                            {copiedJson ? '✓ Copied!' : 'Copy JSON'}
                          </button>
                        </div>

                        <div style={{display: 'flex', flexDirection: 'column', gap: '0.6rem', maxHeight: '280px', overflowY: 'auto', paddingRight: '4px'}}>
                          {storyboardResult.scenes?.map((sc, idx) => (
                            <div key={idx} className="storyboard-scene-row">
                              <div className="scene-meta-row">
                                <span className="scene-badge-pill">Scene {idx + 1}</span>
                                <span className="visual-query-tag" title="Concrete physical query for stock footage retrieval">
                                  🎥 {sc.visual_query || sc.visual_hint}
                                </span>
                              </div>
                              <div style={{fontSize: '0.82rem', color: '#e2e8f0', lineHeight: 1.4}}>
                                {sc.text}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Apply Directly Button */}
                      <button
                        type="button"
                        className="btn-apply-generator"
                        onClick={handleApplyToGenerator}
                      >
                        ⚡ Apply Directly to Video Generator
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <form onSubmit={handleSubmit}>
                  {inputMode === 'script' && (
                    <div className="form-group">
                      <label>Narration Script</label>
                      <textarea rows="4" value={script} onChange={e => setScript(e.target.value)} required placeholder="Enter voiceover script..." />
                    </div>
                  )}

                  {inputMode === 'scenes' && (
                    <div className="form-group">
                      <label>IncuBrix Scene List (JSON array)</label>
                      <textarea rows="5" value={scenesText} onChange={e => setScenesText(e.target.value)} required style={{fontFamily: 'monospace', fontSize: '0.8rem'}} />
                    </div>
                  )}

                  {inputMode === 'audio' && (
                    <div style={{marginBottom: '1.25rem'}}>
                      <div style={{display: 'flex', gap: '0.5rem', marginBottom: '1rem'}}>
                        <button
                          type="button"
                          className={`tab-btn ${audioInputType === 'file' ? 'active' : ''}`}
                          style={{fontSize: '0.8rem', padding: '0.35rem 0.75rem'}}
                          onClick={() => setAudioInputType('file')}
                        >
                          📁 Direct File Upload
                        </button>
                        <button
                          type="button"
                          className={`tab-btn ${audioInputType === 'url' ? 'active' : ''}`}
                          style={{fontSize: '0.8rem', padding: '0.35rem 0.75rem'}}
                          onClick={() => setAudioInputType('url')}
                        >
                          🔗 Public Audio URL
                        </button>
                      </div>

                      {audioInputType === 'file' ? (
                        <div className="form-group">
                          <label>Select Local Audio File (.mp3, .wav, .m4a - up to 10 min)</label>
                          <input
                            type="file"
                            accept=".mp3,.wav,.m4a"
                            onChange={e => setAudioFile(e.target.files[0] || null)}
                            required
                            style={{
                              padding: '0.6rem',
                              background: 'rgba(15, 23, 42, 0.6)',
                              border: '1px solid rgba(255, 255, 255, 0.1)',
                              borderRadius: '8px',
                              width: '100%',
                              color: '#cbd5e1',
                              fontSize: '0.85rem'
                            }}
                          />
                          {audioFile && (
                            <div style={{fontSize: '0.8rem', color: '#38bdf8', marginTop: '0.4rem'}}>
                              ✓ Ready: <strong>{audioFile.name}</strong> ({(audioFile.size / (1024 * 1024)).toFixed(2)} MB)
                            </div>
                          )}
                          <p style={{fontSize: '0.75rem', color: '#64748b', marginTop: '0.35rem'}}>
                            Engine automatically ingests and aligns your voiceover directly on the server.
                          </p>
                          <div className="form-group" style={{marginTop: '0.85rem'}}>
                            <label style={{fontSize: '0.8rem'}}>Voiceover Script / Topic (Optional)</label>
                            <textarea
                              rows="3"
                              value={audioTranscript}
                              onChange={e => setAudioTranscript(e.target.value)}
                              placeholder="Leave blank to automatically transcribe speech from your audio, or paste a transcript..."
                              style={{fontSize: '0.82rem'}}
                            />
                          </div>
                        </div>
                      ) : (
                        <div className="form-group">
                          <label>Voiceover Audio URL (.mp3 / .wav / .m4a)</label>
                          <input
                            type="text"
                            value={audioUrl}
                            onChange={e => setAudioUrl(e.target.value)}
                            placeholder="https://example.com/audio/sample_voiceover.mp3"
                          />
                          <p style={{fontSize: '0.75rem', color: '#64748b', marginTop: '0.35rem'}}>
                            Engine automatically downloads and transcribes speech from public audio files.
                          </p>
                          <div className="form-group" style={{marginTop: '0.85rem'}}>
                            <label style={{fontSize: '0.8rem'}}>Voiceover Script / Topic (Optional)</label>
                            <textarea
                              rows="3"
                              value={audioTranscript}
                              onChange={e => setAudioTranscript(e.target.value)}
                              placeholder="Leave blank to automatically transcribe speech from audio URL, or paste a transcript..."
                              style={{fontSize: '0.82rem'}}
                            />
                          </div>
                        </div>
                      )}

                      {/* Interactive Analyze & Extract Script Workflow */}
                      <div style={{marginTop: '1rem', marginBottom: '0.5rem'}}>
                        <button
                          type="button"
                          onClick={handleAnalyzeAudio}
                          disabled={audioAnalyzing || (audioInputType === 'file' ? !audioFile : !audioUrl.trim())}
                          style={{
                            width: '100%',
                            padding: '0.75rem 1rem',
                            borderRadius: '8px',
                            border: '1px solid rgba(99, 102, 241, 0.4)',
                            background: audioAnalyzing
                              ? 'rgba(99, 102, 241, 0.2)'
                              : 'linear-gradient(135deg, rgba(99, 102, 241, 0.25) 0%, rgba(168, 85, 247, 0.25) 100%)',
                            color: '#a5b4fc',
                            fontSize: '0.88rem',
                            fontWeight: 600,
                            cursor: audioAnalyzing || (audioInputType === 'file' ? !audioFile : !audioUrl.trim()) ? 'not-allowed' : 'pointer',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: '0.5rem',
                            transition: 'all 0.2s',
                          }}
                        >
                          {audioAnalyzing ? (
                            <>
                              <span style={{width: '16px', height: '16px', border: '2px solid rgba(165, 180, 252, 0.3)', borderTopColor: '#a5b4fc', borderRadius: '50%', display: 'inline-block', animation: 'spin 0.8s linear infinite'}}></span>
                              <span>Transcribing audio & generating scenes...</span>
                            </>
                          ) : (
                            <>
                              <span>🎙️ Analyze & Extract Script</span>
                              <span style={{fontSize: '0.75rem', color: '#818cf8', fontWeight: 400}}>(Review scenes before generating)</span>
                            </>
                          )}
                        </button>
                      </div>

                      {/* Error Banner */}
                      {audioAnalyzeError && (
                        <div style={{
                          padding: '0.75rem 1rem',
                          background: 'rgba(239, 68, 68, 0.15)',
                          border: '1px solid rgba(239, 68, 68, 0.4)',
                          borderRadius: '8px',
                          color: '#fca5a5',
                          fontSize: '0.82rem',
                          marginTop: '0.75rem',
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center'
                        }}>
                          <span>{audioAnalyzeError}</span>
                          <button type="button" onClick={() => setAudioAnalyzeError(null)} style={{background: 'none', border: 'none', color: '#fca5a5', cursor: 'pointer', fontSize: '1rem'}}>✕</button>
                        </div>
                      )}

                      {/* Interactive Review Gate Card */}
                      {audioReviewData && (
                        <div style={{
                          marginTop: '1rem',
                          padding: '1.25rem',
                          background: 'rgba(15, 23, 42, 0.95)',
                          border: '1px solid rgba(99, 102, 241, 0.5)',
                          borderRadius: '10px',
                          boxShadow: '0 8px 30px rgba(0,0,0,0.4)',
                        }}>
                          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem'}}>
                            <span style={{fontSize: '0.9rem', fontWeight: 700, color: '#a5b4fc', display: 'flex', alignItems: 'center', gap: '0.4rem'}}>
                              ✨ Audio Transcript & Scenes Review
                            </span>
                            <button
                              type="button"
                              onClick={() => setAudioReviewData(null)}
                              style={{background: 'none', border: 'none', color: '#94a3b8', cursor: 'pointer', fontSize: '1.1rem'}}
                              title="Dismiss"
                            >
                              ✕
                            </button>
                          </div>
                          <p style={{fontSize: '0.78rem', color: '#94a3b8', marginBottom: '0.85rem'}}>
                            Speech recognized! You can manually adjust the extracted narration transcript and scene keywords before loading into the generator.
                          </p>

                          <div className="form-group" style={{marginBottom: '0.85rem'}}>
                            <label style={{fontSize: '0.8rem', color: '#e2e8f0', fontWeight: 600}}>Extracted Transcript (Editable)</label>
                            <textarea
                              rows="3"
                              value={audioReviewData.raw_transcript}
                              onChange={e => setAudioReviewData({ ...audioReviewData, raw_transcript: e.target.value })}
                              style={{fontSize: '0.82rem'}}
                            />
                          </div>

                          <div className="form-group" style={{marginBottom: '1rem'}}>
                            <label style={{fontSize: '0.8rem', color: '#e2e8f0', fontWeight: 600}}>Generated IncuBrix Scenes (Editable JSON)</label>
                            <textarea
                              rows="6"
                              value={audioReviewData.scenes_json}
                              onChange={e => setAudioReviewData({ ...audioReviewData, scenes_json: e.target.value })}
                              style={{fontFamily: 'monospace', fontSize: '0.78rem'}}
                            />
                          </div>

                          <button
                            type="button"
                            onClick={handleConfirmAudioScenes}
                            style={{
                              width: '100%',
                              padding: '0.8rem',
                              borderRadius: '8px',
                              border: 'none',
                              background: 'linear-gradient(135deg, #10b981 0%, #06b6d4 100%)',
                              color: '#fff',
                              fontWeight: 700,
                              fontSize: '0.9rem',
                              cursor: 'pointer',
                              display: 'flex',
                              alignItems: 'center',
                              justifyContent: 'center',
                              gap: '0.5rem',
                              boxShadow: '0 4px 14px rgba(16, 185, 129, 0.35)'
                            }}
                          >
                            ✓ Confirm & Load into Scene Editor
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  <div className="form-group">
                    <label>Narration Voice</label>
                    <select value={voice} onChange={e => setVoice(e.target.value)}>
                      <option value="en-IN-female">en-IN-female (Indian English)</option>
                      <option value="en-US-male">en-US-male (American English)</option>
                      <option value="hi-IN-female">hi-IN-female (Hindi)</option>
                      <option value="ta-IN-female">ta-IN-female (Tamil)</option>
                    </select>
                  </div>

                  <div className="form-group">
                    <label>Aspect Ratios</label>
                    <div className="checkbox-group">
                      {['16:9', '9:16', '1:1'].map(r => (
                        <label key={r} className="checkbox-label">
                          <input type="checkbox" checked={aspectRatios.includes(r)} onChange={() => toggleRatio(r)} />
                          {r}
                        </label>
                      ))}
                    </div>
                  </div>

                  <div className="form-group">
                    <label>Visual Style Prompt</label>
                    <input type="text" value={style} onChange={e => setStyle(e.target.value)} />
                  </div>

                  <div className="form-group">
                    <label>Avoid Content (comma separated)</label>
                    <input type="text" value={avoid} onChange={e => setAvoid(e.target.value)} />
                  </div>

                  <button type="submit" className="btn-submit" disabled={loading}>
                    {loading ? 'Creating Job...' : 'Generate B-Roll Video'}
                  </button>
                </form>
              )}
            </div>

            {/* Status & Output Card */}
            <div className="card">
              <h2>2. Job Status & Real-time Progress</h2>
              {!jobStatus ? (
                <div style={{color: '#64748b', fontSize: '0.9rem', textAlign: 'center', padding: '3rem 1rem'}}>
                  Submit a job on the left to start background generation.
                </div>
              ) : (
                <div>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem'}}>
                    <span style={{fontSize: '0.8rem', color: '#94a3b8'}}>Job ID: <code style={{color: '#fff'}}>{jobStatus.job_id.substring(0, 16)}...</code></span>
                    <span className={`badge badge-${jobStatus.status}`}>{jobStatus.status}</span>
                  </div>

                  <div className="progress-track">
                    <div className="progress-bar" style={{width: `${jobStatus.progress}%`}} />
                  </div>

                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.8rem', marginBottom: '1.25rem'}}>
                    <span className="stage-pill">Stage: {jobStatus.stage}</span>
                    <span style={{fontWeight: 600, color: '#a5b4fc'}}>{jobStatus.progress}%</span>
                  </div>

                  {jobStatus.warnings && jobStatus.warnings.length > 0 && (
                    <div className="warning-box">
                      <strong>Warnings:</strong>
                      <ul style={{marginLeft: '1.25rem', marginTop: '0.25rem'}}>
                        {jobStatus.warnings.map((w, i) => <li key={i}>{w}</li>)}
                      </ul>
                    </div>
                  )}

                  {jobStatus.error && (
                    <div className="error-box">
                      <strong>Error [{jobStatus.error.code}]:</strong> {jobStatus.error.message}
                    </div>
                  )}

                  {/* Outputs Available */}
                  <h3 style={{fontSize: '0.95rem', fontWeight: 600, marginTop: '1.5rem', marginBottom: '0.75rem'}}>Generated Outputs</h3>
                  {jobStatus.result_urls ? (
                    <div>
                      {/* Video Player Preview if any video exists */}
                      {Object.keys(jobStatus.result_urls).some(k => k.startsWith('video_')) && (
                        <div style={{marginBottom: '1.25rem', background: '#090d16', borderRadius: '12px', border: '1px solid rgba(99, 102, 241, 0.3)', padding: '1rem', overflow: 'hidden'}}>
                          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem', flexWrap: 'wrap', gap: '0.5rem'}}>
                            <span style={{fontSize: '0.9rem', fontWeight: 600, color: '#f8fafc', display: 'flex', alignItems: 'center', gap: '0.4rem'}}>
                              🎬 Video Player & Preview
                            </span>
                            <div style={{display: 'flex', gap: '0.35rem'}}>
                              {Object.keys(jobStatus.result_urls).filter(k => k.startsWith('video_')).map(k => {
                                const ratio = k.replace('video_', '').replace('_', ':');
                                const isActive = (selectedRatioPreview === ratio) || (!selectedRatioPreview && k === 'video_16_9');
                                return (
                                  <button
                                    key={k}
                                    type="button"
                                    onClick={() => setSelectedRatioPreview(ratio)}
                                    style={{
                                      padding: '0.25rem 0.6rem',
                                      fontSize: '0.75rem',
                                      borderRadius: '4px',
                                      border: isActive ? '1px solid #6366f1' : '1px solid #334155',
                                      background: isActive ? 'rgba(99, 102, 241, 0.25)' : 'rgba(30, 41, 59, 0.5)',
                                      color: isActive ? '#a5b4fc' : '#94a3b8',
                                      cursor: 'pointer'
                                    }}
                                  >
                                    {ratio}
                                  </button>
                                );
                              })}
                            </div>
                          </div>

                          <div style={{
                            width: '100%',
                            maxHeight: '400px',
                            background: '#000',
                            borderRadius: '8px',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            overflow: 'hidden'
                          }}>
                            <video
                              key={`preview_${jobStatus.job_id}_${selectedRatioPreview}`}
                              controls
                              playsInline
                              preload="metadata"
                              style={{width: '100%', maxHeight: '400px', objectFit: 'contain', borderRadius: '8px'}}
                              src={`/api/v1/jobs/download/${jobStatus.job_id}/video_${selectedRatioPreview.replace(':', '_')}.mp4?preview=1`}
                            >
                              Your browser does not support the video tag.
                            </video>
                          </div>
                        </div>
                      )}

                      {/* Download Error Banner */}
                      {downloadError && (
                        <div style={{
                          padding: '0.75rem 1rem',
                          background: 'rgba(239, 68, 68, 0.15)',
                          border: '1px solid rgba(239, 68, 68, 0.4)',
                          borderRadius: '8px',
                          color: '#fca5a5',
                          fontSize: '0.82rem',
                          marginBottom: '1rem',
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center'
                        }}>
                          <span>{downloadError}</span>
                          <button type="button" onClick={() => setDownloadError(null)} style={{background: 'none', border: 'none', color: '#fca5a5', cursor: 'pointer', fontSize: '1rem'}}>✕</button>
                        </div>
                      )}

                      {/* Output File Rows */}
                      {Object.entries(jobStatus.result_urls).map(([key, url]) => {
                        const isReady = jobStatus.outputs_available ? jobStatus.outputs_available[key] : true;
                        const filename = key.startsWith('video_')
                          ? (key.endsWith('.mp4') ? key : `${key}.mp4`)
                          : (key === 'captions_srt' ? 'captions.srt' : (key === 'timeline_json' ? 'timeline.json' : (key === 'manifest_json' ? 'manifest.json' : (key.includes('.') ? key : `${key}.mp4`))));
                        const downloadHref = `/api/v1/jobs/download/${jobStatus.job_id}/${filename}`;
                        const isDownloading = downloadingKey === key;

                        return (
                          <div key={key} className="output-item">
                            <div>
                              <span style={{fontSize: '0.85rem', color: '#cbd5e1', fontWeight: 500}}>{key}</span>
                              <span style={{fontSize: '0.75rem', color: '#64748b', marginLeft: '0.5rem'}}>({filename})</span>
                            </div>
                            <div style={{display: 'flex', alignItems: 'center', gap: '0.75rem'}}>
                              {isReady ? (
                                <>
                                  <button
                                    type="button"
                                    onClick={() => handleDownload(downloadHref, filename, key)}
                                    disabled={isDownloading}
                                    className="btn-download"
                                  >
                                    {isDownloading ? '⏳ Downloading...' : 'Download ↓'}
                                  </button>
                                  <a
                                    href={downloadHref}
                                    download={filename}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="output-link"
                                    style={{fontSize: '0.78rem', color: '#94a3b8'}}
                                    title="Open directly or download via browser"
                                  >
                                    Direct Link ↗
                                  </a>
                                </>
                              ) : (
                                <span style={{fontSize: '0.75rem', color: '#64748b'}}>Rendering...</span>
                              )}
                            </div>
                          </div>
                        );
                      })}

                      <div style={{display: 'flex', gap: '0.5rem', marginTop: '1rem'}}>
                        <button type="button" onClick={() => viewMetadata('timeline')} className="tab-btn active" style={{fontSize: '0.8rem'}}>View timeline.json</button>
                        <button type="button" onClick={() => viewMetadata('manifest')} className="tab-btn active" style={{fontSize: '0.8rem'}}>View manifest.json</button>
                      </div>
                    </div>
                  ) : (
                    <p style={{fontSize: '0.85rem', color: '#64748b'}}>Outputs will appear here upon completion.</p>
                  )}

                </div>
              )}

              {/* Modal Viewer */}
              {activeModal && modalData && (
                <div style={{marginTop: '1.5rem'}}>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem'}}>
                    <h3 style={{fontSize: '0.85rem', color: '#818cf8'}}>{activeModal}.json Viewer</h3>
                    <button type="button" onClick={() => setActiveModal(null)} style={{background: 'transparent', border: 'none', color: '#94a3b8', cursor: 'pointer'}}>Close ✕</button>
                  </div>
                  <pre className="code-viewer">{JSON.stringify(modalData, null, 2)}</pre>
                </div>
              )}
            </div>
          </div>

        {/* Scene Clip Swapper Panel — appears once a completed job has a timeline */}
        {activeJobId && jobStatus && ['completed', 'succeeded'].includes(jobStatus.status) && (
          <div className="swap-panel">
            <h2>🎬 Scene Clip Swapper</h2>
            <p style={{fontSize: '0.82rem', color: '#64748b', marginBottom: '1.25rem'}}>
              Select a scene below, enter a replacement search description, then submit to
              re-render only that clip — all other scenes are reused unchanged.
            </p>

            {/* Load timeline if not yet fetched */}
            {!timelineData && (
              <button
                id="btn-load-scenes"
                type="button"
                className="tab-btn active"
                style={{fontSize: '0.8rem', marginBottom: '1rem'}}
                onClick={() => fetchTimeline(activeJobId)}
              >Load Scenes from Timeline</button>
            )}

            {/* Scene list */}
            {timelineData && timelineData.scenes && timelineData.scenes.length > 0 && (
              <div className="scene-list">
                {timelineData.scenes.map((sc, idx) => (
                  <div
                    key={sc.scene_id}
                    id={`scene-item-${idx}`}
                    className={`scene-item ${selectedSceneForSwap?.scene_id === sc.scene_id ? 'selected' : ''}`}
                    onClick={() => {
                      setSelectedSceneForSwap(sc);
                      setSwapMsg(null);
                      if (!swapQuery) setSwapQuery(sc.visual_hint || sc.text?.substring(0, 60) || '');
                    }}
                    role="button"
                    tabIndex={0}
                    onKeyDown={ev => ev.key === 'Enter' && setSelectedSceneForSwap(sc)}
                  >
                    <span className="scene-num">{idx}</span>
                    <span className="scene-text">{sc.text?.substring(0, 80)}{sc.text?.length > 80 ? '…' : ''}</span>
                    <span className="scene-provider">{sc.clip?.provider || 'no clip'}</span>
                  </div>
                ))}
              </div>
            )}

            {/* Swap form — shown only when a scene is selected */}
            {selectedSceneForSwap && (
              <div className="swap-form">
                <span className="swap-selected-label"
                  id="swap-selected-scene-label">
                  Replacing: <strong>{selectedSceneForSwap.scene_id}</strong>
                </span>

                <form id="scene-swap-form" onSubmit={handleSwapSubmit}>
                  <div className="form-group">
                    <label htmlFor="swap-query-input">Search Description <span style={{color:'#64748b'}}>(query for replacement footage)</span></label>
                    <input
                      id="swap-query-input"
                      type="text"
                      value={swapQuery}
                      onChange={e => setSwapQuery(e.target.value)}
                      placeholder={`e.g. "${selectedSceneForSwap.visual_hint || 'city skyline business team'}"`}
                      disabled={swapLoading}
                    />
                  </div>

                  {/* Advanced options toggle */}
                  <button
                    type="button"
                    className="advanced-toggle"
                    onClick={() => setSwapAdvanced(p => !p)}
                    id="swap-advanced-toggle"
                  >
                    {swapAdvanced ? '▲' : '▶'} Advanced options
                  </button>

                  {swapAdvanced && (
                    <div>
                      <div className="form-group">
                        <label htmlFor="swap-provider-select">Provider Preference</label>
                        <select
                          id="swap-provider-select"
                          value={swapProvider}
                          onChange={e => setSwapProvider(e.target.value)}
                          disabled={swapLoading}
                        >
                          <option value="">Auto (default chain)</option>
                          <option value="pexels">Pexels</option>
                          <option value="pixabay">Pixabay</option>
                          <option value="mock">Mock / Procedural</option>
                        </select>
                      </div>
                      <div className="form-group">
                        <label htmlFor="swap-clip-id-input">Clip ID <span style={{color:'#64748b'}}>(optional specific clip)</span></label>
                        <input
                          id="swap-clip-id-input"
                          type="text"
                          value={swapClipId}
                          onChange={e => setSwapClipId(e.target.value)}
                          placeholder="e.g. pexels_12345"
                          disabled={swapLoading}
                        />
                      </div>
                      <div className="form-group">
                        <label htmlFor="swap-video-url-input">Custom Video URL <span style={{color:'#64748b'}}>(direct .mp4 link)</span></label>
                        <input
                          id="swap-video-url-input"
                          type="text"
                          value={swapVideoUrl}
                          onChange={e => setSwapVideoUrl(e.target.value)}
                          placeholder="https://example.com/clip.mp4"
                          disabled={swapLoading}
                        />
                      </div>
                    </div>
                  )}

                  <button
                    id="btn-submit-swap"
                    type="submit"
                    className="btn-swap"
                    disabled={swapLoading}
                  >
                    {swapLoading
                      ? '⏳ Replacing clip… this may take a moment'
                      : `Replace Scene ${selectedSceneForSwap.scene_id} Clip`}
                  </button>
                </form>

                {/* Success / Error feedback */}
                {swapMsg && swapMsg.type === 'success' && (
                  <div className="swap-success-box" id="swap-success-msg">
                    ✅ {swapMsg.text}
                  </div>
                )}
                {swapMsg && swapMsg.type === 'error' && (
                  <div className="error-box" id="swap-error-msg">
                    ❌ {swapMsg.text}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
