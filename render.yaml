services:
  - type: web
    name: incubrix-video-engine
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: FFMPEG_THREADS
        value: 2
      - key: MAX_CONCURRENT_JOBS
        value: 1
      - key: TTS_PROVIDER
        value: gtts
      - key: PIXABAY_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
